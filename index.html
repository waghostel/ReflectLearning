<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ReflectLearning AI Tutor</title>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;700;900&family=Inter:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
      rel="stylesheet"
    />
    <style>
      .font-lexend {
        font-family: 'Lexend', sans-serif;
      }
      .font-inter {
        font-family: 'Inter', sans-serif;
      }
      /* Hide scrollbar but keep scrolling functionality */
      .hide-scrollbar {
        scrollbar-width: none; /* Firefox */
        -ms-overflow-style: none; /* IE and Edge */
      }
      .hide-scrollbar::-webkit-scrollbar {
        display: none; /* Chrome, Safari, Opera */
      }
      @keyframes breathing {
        0%, 100% {
            opacity: 1;
        }
        50% {
            opacity: 0.75;
        }
      }
      .animate-breathing {
        animation: breathing 2.5s ease-in-out infinite;
      }
      .reflection-slide {
        transition: opacity 300ms ease-in-out, filter 300ms ease-in-out;
      }
      .reflection-slide.fading-out {
          opacity: 0;
          filter: blur(5px);
      }
      .reflection-slide.fading-in {
          opacity: 1;
          filter: blur(0px);
      }
      .highlighted-text-red {
        color: #f87171; /* Red text */
        background-color: rgba(248, 113, 113, 0.2); /* Transparent red background */
        padding: 2px 4px;
        border-radius: 4px;
        text-decoration: underline;
        text-decoration-color: #f87171; /* Red underline */
        text-decoration-thickness: 1.5px;
        text-underline-offset: 4px;
        font-style: normal; /* Override italic from 'em' */
        font-weight: 500;
      }
      .highlighted-text-yellow {
        color: #fde047; /* Yellow text */
        background-color: rgba(253, 224, 71, 0.2); /* Transparent yellow background */
        padding: 2px 4px;
        border-radius: 4px;
        text-decoration: underline;
        text-decoration-color: #fde047; /* Yellow underline */
        text-decoration-thickness: 1.5px;
        text-underline-offset: 4px;
        font-style: normal; /* Override bold from 'strong' */
        font-weight: 700; /* Keep it bold */
      }
      .mcq-option {
        display: flex;
        align-items: center;
        gap: 0.75rem; /* 12px */
        padding: 0.5rem; /* 8px */
        border-radius: 0.5rem; /* 8px */
        cursor: pointer;
        transition: background-color 150ms ease-in-out;
        width: 100%;
        text-align: left;
        border: none;
        background: none;
        color: inherit;
        font: inherit;
      }
      .mcq-option:hover:not(:disabled) {
        background-color: rgba(255, 255, 255, 0.1);
      }
      .mcq-option:disabled {
        cursor: not-allowed;
      }
      .mcq-letter {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 1.75rem; /* 28px */
        height: 1.75rem; /* 28px */
        border-radius: 9999px; /* circle */
        background-color: #fde047; /* yellow */
        color: #111722; /* dark text */
        font-weight: bold;
        flex-shrink: 0;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.29.0",
    "react-markdown": "https://aistudiocdn.com/react-markdown@^10.1.0",
    "remark-gfm": "https://esm.sh/remark-gfm@4.0.0"
  }
}
</script>
</head>

    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
